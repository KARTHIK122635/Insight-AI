<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagonal Frame -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="#0B0F19" stroke="url(#grad-primary)" stroke-width="3" />
  
  <!-- Isometric Inner Facets -->
  <!-- Top Facet -->
  <polygon points="32,8 52,20 32,32 12,20" fill="url(#grad-primary)" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1.5" />
  
  <!-- Left Bottom Facet -->
  <polygon points="12,20 32,32 32,56 12,44" fill="url(#grad-accent)" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.5" />
  
  <!-- Right Bottom Facet -->
  <polygon points="32,32 52,20 52,44 32,56" fill="url(#grad-primary)" fill-opacity="0.5" stroke="#8B5CF6" stroke-width="1.5" />
  
  <!-- Central Neural Spark / Vector Hub -->
  <circle cx="32" cy="32" r="5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
  
  <!-- Circuit Nodes -->
  <line x1="32" y1="32" x2="32" y2="14" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="14" r="2" fill="#38BDF8" />
  
  <line x1="32" y1="32" x2="46" y2="40" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />
  <circle cx="46" cy="40" r="2" fill="#8B5CF6" />
  
  <line x1="32" y1="32" x2="18" y2="40" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  <circle cx="18" cy="40" r="2" fill="#06B6D4" />
</svg>
