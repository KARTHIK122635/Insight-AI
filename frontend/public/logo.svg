<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logo-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="logo-grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Emblem Group -->
  <g transform="translate(4, 4) scale(0.875)">
    <!-- Hexagonal Frame -->
    <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="#0B0F19" stroke="url(#logo-grad-primary)" stroke-width="3" />
    <!-- Isometric Inner Facets -->
    <polygon points="32,8 52,20 32,32 12,20" fill="url(#logo-grad-primary)" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1.5" />
    <polygon points="12,20 32,32 32,56 12,44" fill="#06B6D4" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.5" />
    <polygon points="32,32 52,20 52,44 32,56" fill="url(#logo-grad-primary)" fill-opacity="0.5" stroke="#8B5CF6" stroke-width="1.5" />
    <!-- Center Node -->
    <circle cx="32" cy="32" r="5" fill="#38BDF8" filter="url(#logo-glow)" />
    <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
    <!-- Connectors -->
    <line x1="32" y1="32" x2="32" y2="14" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <circle cx="32" cy="14" r="2" fill="#38BDF8" />
    <line x1="32" y1="32" x2="46" y2="40" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />
    <circle cx="46" cy="40" r="2" fill="#8B5CF6" />
    <line x1="32" y1="32" x2="18" y2="40" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
    <circle cx="18" cy="40" r="2" fill="#06B6D4" />
  </g>
  
  <!-- Brand Typography -->
  <text x="72" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Insight<tspan fill="url(#logo-grad-text)">AI</tspan></text>
  
  <!-- Badge -->
  <rect x="186" y="20" width="34" height="18" rx="5" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1" />
  <text x="193" y="32.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#818CF8">PRO</text>
  
  <!-- Subtitle -->
  <text x="73" y="49" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8" letter-spacing="0.2">Intelligence Platform</text>
</svg>
