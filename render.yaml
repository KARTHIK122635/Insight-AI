services:
  - type: web
    name: insight-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: PRIMARY_MODEL
        value: Qwen/Qwen2.5-Coder-32B-Instruct
      - key: FALLBACK_MODEL
        value: Qwen/Qwen2.5-Coder-7B-Instruct
      - key: HF_ROUTER_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
